services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: fiapgames-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - fiapgames-network

  auth-api:
    build:
      context: ../FiapGame.AuthService
      dockerfile: Dockerfile
    container_name: fiapgames-auth-api
    ports:
      - "8081:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FIAPGamesConnection: "${AUTH_CONNECTION_STRING:-Server=sqlserver,1433;Database=fiapgames_auth;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True}"
      Jwt__PrivateKeyFile: "/run/secrets/jwt-private.pem"
      Jwt__Issuer: "${JWT_ISSUER:-FiapGamesApi}"
      Jwt__Audience: "${JWT_AUDIENCE:-FiapGamesClients}"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "${RABBITMQ_USERNAME:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    secrets:
      - source: jwt-private-key
        target: jwt-private.pem
    networks:
      - fiapgames-network

  auth-migrate:
    build:
      context: ../FiapGame.AuthService
      dockerfile: Dockerfile
    command: ["--migrate"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FIAPGamesConnection: "${AUTH_CONNECTION_STRING:-Server=sqlserver,1433;Database=fiapgames_auth;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True}"
      Jwt__PrivateKeyFile: "/run/secrets/jwt-private.pem"
      Jwt__Issuer: "${JWT_ISSUER:-FiapGamesApi}"
      Jwt__Audience: "${JWT_AUDIENCE:-FiapGamesClients}"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__UserName: "${RABBITMQ_USERNAME:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"
    depends_on:
      sqlserver:
        condition: service_healthy
    secrets:
      - source: jwt-private-key
        target: jwt-private.pem
    networks:
      - fiapgames-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fiapgames-sqlserver
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD:-YourStrong@Passw0rd}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQLSERVER_SA_PASSWORD:-YourStrong@Passw0rd}' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fiapgames-network

  payment-api:
    build:
      context: ../FiapGame.PaymentService/FiapGames.PaymentService
      dockerfile: Dockerfile
    container_name: fiapgames-payment-api
    ports:
      - "8083:8082"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FIAPGamesConnection: "${PAYMENT_CONNECTION_STRING:-Server=sqlserver,1433;Database=fiapgames_payment;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;Encrypt=False;Connect Timeout=60;ConnectRetryCount=20;ConnectRetryInterval=5}"
      Jwt__JwksUri: "http://auth-api:8081/.well-known/jwks"
      Jwt__Issuer: "${JWT_ISSUER:-FiapGamesApi}"
      Jwt__Audience: "${JWT_AUDIENCE:-FiapGamesClients}"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "${RABBITMQ_USERNAME:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"
    depends_on:
      payment-migrate:
        condition: service_completed_successfully
      auth-api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - fiapgames-network

  payment-migrate:
    build:
      context: ../FiapGame.PaymentService/FiapGames.PaymentService
      dockerfile: Dockerfile
    command: ["--migrate"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FIAPGamesConnection: "${PAYMENT_CONNECTION_STRING:-Server=sqlserver,1433;Database=fiapgames_payment;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;Encrypt=False}"
      Jwt__JwksUri: "http://auth-api:8081/.well-known/jwks"
      Jwt__Issuer: "${JWT_ISSUER:-FiapGamesApi}"
      Jwt__Audience: "${JWT_AUDIENCE:-FiapGamesClients}"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__UserName: "${RABBITMQ_USERNAME:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - fiapgames-network

  catalog-api:
    build:
      context: ../FiapGames.Catalog
      dockerfile: Dockerfile
    container_name: fiapgames-catalog-api
    ports:
      - "8082:8082"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FIAPGamesConnection: "${CATALOG_CONNECTION_STRING:-Server=sqlserver,1433;Database=fiapgames_catalog;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;Encrypt=False;Connect Timeout=60;ConnectRetryCount=20;ConnectRetryInterval=5}"
      Jwt__JwksUri: "http://auth-api:8081/.well-known/jwks"
      Jwt__Issuer: "${JWT_ISSUER:-FiapGamesApi}"
      Jwt__Audience: "${JWT_AUDIENCE:-FiapGamesClients}"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "${RABBITMQ_USERNAME:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
      auth-api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - fiapgames-network

  catalog-migrate:
    build:
      context: ../FiapGames.Catalog
      dockerfile: Dockerfile
    command: ["--migrate"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FIAPGamesConnection: "${CATALOG_CONNECTION_STRING:-Server=sqlserver,1433;Database=fiapgames_catalog;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;Encrypt=False}"
      Jwt__JwksUri: "http://auth-api:8081/.well-known/jwks"
      Jwt__Issuer: "${JWT_ISSUER:-FiapGamesApi}"
      Jwt__Audience: "${JWT_AUDIENCE:-FiapGamesClients}"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__UserName: "${RABBITMQ_USERNAME:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - fiapgames-network

  notification-worker:
    build:
      context: ../FiapGames.Notification
      dockerfile: Dockerfile
    container_name: fiapgames-notification-worker
    ports:
      - "8084:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "${NOTIFICATION_CONNECTION_STRING:-Server=sqlserver,1433;Database=fiapgames_notification;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;Encrypt=False;Connect Timeout=60;ConnectRetryCount=20;ConnectRetryInterval=5}"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "${RABBITMQ_USERNAME:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - fiapgames-network

  notification-migrate:
    build:
      context: ../FiapGames.Notification
      dockerfile: Dockerfile
    command: ["--migrate"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "${NOTIFICATION_CONNECTION_STRING:-Server=sqlserver,1433;Database=fiapgames_notification;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;Encrypt=False}"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__UserName: "${RABBITMQ_USERNAME:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - fiapgames-network

volumes:
  sqlserver-data:

networks:
  fiapgames-network:
    name: fiapgames-network

secrets:
  jwt-private-key:
    file: ${JWT_PRIVATE_KEY_FILE:-./jwt-private.pem}
