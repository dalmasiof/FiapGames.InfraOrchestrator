services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: fiapgames-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - fiapgames-network

  auth-api:
    build:
      context: ../FiapGame.AuthService
      dockerfile: Dockerfile
    container_name: fiapgames-auth-api
    ports:
      - "8081:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FIAPGamesConnection: "${AUTH_CONNECTION_STRING:-Server=sqlserver-auth,1433;Database=fiapgames_auth;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True}"
      Jwt__Key: "${JWT_KEY:-CHANGE_ME_WITH_LONG_SECURE_JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER:-FiapGamesApi}"
      Jwt__Audience: "${JWT_AUDIENCE:-FiapGamesClients}"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "${RABBITMQ_USERNAME:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"
    depends_on:
      sqlserver-auth:
        condition: service_healthy
    networks:
      - fiapgames-network

  sqlserver-auth:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fiapgames-auth-db
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD:-YourStrong@Passw0rd}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-auth-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQLSERVER_SA_PASSWORD:-YourStrong@Passw0rd}' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fiapgames-network

  payment-api:
    build:
      context: ../FiapGame.PaymentService/FiapGames.PaymentService
      dockerfile: Dockerfile
    container_name: fiapgames-payment-api
    ports:
      - "8083:8082"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FIAPGamesConnection: "${PAYMENT_CONNECTION_STRING:-Server=sqlserver-payment,1433;Database=fiapgames_payment;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;Encrypt=False;Connect Timeout=60;ConnectRetryCount=20;ConnectRetryInterval=5}"
      Jwt__Key: "${JWT_KEY:-CHANGE_ME_WITH_LONG_SECURE_JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER:-FiapGamesApi}"
      Jwt__Audience: "${JWT_AUDIENCE:-FiapGamesClients}"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "${RABBITMQ_USERNAME:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"
    depends_on:
      sqlserver-payment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fiapgames-network

  sqlserver-payment:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fiapgames-payment-db
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD:-YourStrong@Passw0rd}"
    ports:
      - "1436:1433"
    volumes:
      - sqlserver-payment-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQLSERVER_SA_PASSWORD:-YourStrong@Passw0rd}' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fiapgames-network

  catalog-api:
    build:
      context: ../FiapGames.Catalog
      dockerfile: Dockerfile
    container_name: fiapgames-catalog-api
    ports:
      - "8082:8082"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FIAPGamesConnection: "${CATALOG_CONNECTION_STRING:-Server=sqlserver-catalog,1433;Database=fiapgames_catalog;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;Encrypt=False;Connect Timeout=60;ConnectRetryCount=20;ConnectRetryInterval=5}"
      Jwt__Key: "${JWT_KEY:-CHANGE_ME_WITH_LONG_SECURE_JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER:-FiapGamesApi}"
      Jwt__Audience: "${JWT_AUDIENCE:-FiapGamesClients}"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "${RABBITMQ_USERNAME:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"
    depends_on:
      sqlserver-catalog:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fiapgames-network

  sqlserver-catalog:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fiapgames-catalog-db
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD:-YourStrong@Passw0rd}"
    ports:
      - "1437:1433"
    volumes:
      - sqlserver-catalog-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQLSERVER_SA_PASSWORD:-YourStrong@Passw0rd}' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fiapgames-network

  notification-worker:
    build:
      context: ../FiapGames.Notification
      dockerfile: Dockerfile
    container_name: fiapgames-notification-worker
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "${NOTIFICATION_CONNECTION_STRING:-Server=sqlserver-notification,1433;Database=fiapgames_notifications;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;Encrypt=False;Connect Timeout=60;ConnectRetryCount=20;ConnectRetryInterval=5}"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "${RABBITMQ_USERNAME:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-guest}"
    depends_on:
      sqlserver-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fiapgames-network

  sqlserver-notification:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fiapgames-notification-db
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD:-YourStrong@Passw0rd}"
    ports:
      - "1435:1433"
    volumes:
      - sqlserver-notification-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQLSERVER_SA_PASSWORD:-YourStrong@Passw0rd}' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fiapgames-network

volumes:
  sqlserver-auth-data:
  sqlserver-payment-data:
  sqlserver-catalog-data:
  sqlserver-notification-data:

networks:
  fiapgames-network:
    name: fiapgames-network
