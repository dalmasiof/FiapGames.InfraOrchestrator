apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver-payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver-payment
  template:
    metadata:
      labels:
        app: sqlserver-payment
    spec:
      containers:
        - name: sqlserver-payment
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              value: "YourStrong@Passw0rd"
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -C -Q 'SELECT 1'"
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - mountPath: /var/opt/mssql
              name: mssql-payment-data
      volumes:
        - name: mssql-payment-data
          emptyDir: {}
